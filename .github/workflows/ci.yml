# Every push and pull request: rebuild the site files from the data branch (no fetching) and run
# the Python and JS tests (node is preinstalled on the runner; no npm). The data branch is checked out into .data/, where scrape.py expects it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch into .data/
        uses: actions/checkout@v4
        with:
          ref: data
          path: .data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exit code 2 = built with warnings (a secondary source kept its last good data): fine here.
      - name: Build the site files from the archive
        run: python3 scrape.py --from-archive || [ $? -eq 2 ]

      - name: Every file the page loads is in the build
        run: python3 tools/check_site.py .

      - name: Python tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: JS tests (engine goldens, program validation, rules-out-of-code guard)
        run: node --test tests/js/*.test.js
